apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-postgres
  labels:
    app: postgres
spec:
  replicas: 1
  serviceName: "postgres-service"
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        tier: backend
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: local
              mountPath: var/lib/postgresql/data
          env:
            - name: POSTGRES_DB
              value: "miodb"
            - name: POSTGRES_USER
              value: "admin"
            - name: POSTGRES_PASSWORD
              value: "password"
      volumes:
        - name: local
          hostPath:
            path: /data/postgres
            type: DirectoryOrCreate
  updateStrategy:
    type: RollingUpdate