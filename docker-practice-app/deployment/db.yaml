apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-postgres
  labels:
    app: postgres
spec:
  replicas: 1
  serviceName: "postgres-service"
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        tier: backend
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: local
              mountPath: var/lib/postgresql/data
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username

            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: db-name
      volumes:
        - name: local
          hostPath:
            path: /data/postgres
            type: DirectoryOrCreate

  updateStrategy:
    type: RollingUpdate