apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      tier: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        tier: backend
    spec:
      nodeSelector:
        tier: backend
      containers:
        - name: backend
          image: training-java-backend:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING.DATASOURCE.USERNAME
              valueFrom:
                secretKeyRef: 
                  name: db-credentials
                  key: username
            
            - name: SPRING.DATASOURCE.PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            
            - name: SPRING.DATASOURCE.URL
              valueFrom:
                configMapKeyRef: 
                  name: app-config
                  key: spring-url
     
