apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: devops-training

nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP

  - role: worker
    labels:
      tier: frontend

  - role: worker
    labels:
      tier: backend
    extraMounts:
      - hostPath: /home/giuse/data-training-devops/postgres
        containerPath: /data/postgres