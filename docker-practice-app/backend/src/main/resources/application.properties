server.port=${SERVER_PORT:8080}

# --- Database (configurabile via variabili d'ambiente) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:appdb}
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASSWORD:apppass}

# Crea/aggiorna le tabelle automaticamente (comodo per l'esercizio)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Endpoint /actuator/health utile per gli HEALTHCHECK nei Dockerfile
management.endpoints.web.exposure.include=health
