apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-resource-frontend
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8080